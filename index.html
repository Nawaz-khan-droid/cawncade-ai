<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAWNCADE AI - Dashboard</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (No Node.js) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: { DEFAULT: '#0f1117', 900: '#15171e', 800: '#1a1c23', 700: '#23252d' },
                        primary: { DEFAULT: '#3b82f6', hover: '#2563eb' },
                        alert: '#ef4444', success: '#10b981', warning: '#f59e0b',
                        text: { DEFAULT: '#e2e8f0', muted: '#94a3b8' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card {
                @apply bg-surface-900 border border-white/5 rounded-2xl shadow-lg transition-all duration-300;
            }
            .glass-card:hover {
                @apply scale-[1.02] border-white/10 shadow-[0_0_15px_rgba(255,255,255,0.05)];
            }
            .btn-primary {
                @apply bg-primary hover:bg-primary-hover text-white font-medium rounded-xl transition-all duration-200 active:scale-95 shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:shadow-[0_0_25px_rgba(59,130,246,0.5)];
            }
            .btn-primary:disabled {
                @apply opacity-50 cursor-not-allowed hover:bg-primary active:scale-100 shadow-none hover:shadow-none;
            }
        }
        body { background-color: #0f1117; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #23252d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-white/5 w-full">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-gradient-to-tr from-primary to-cyan-400 flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                    <i data-lucide="activity" class="w-5 h-5 text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">
                    CAWNCADE <span class="text-primary font-medium">AI</span>
                </h1>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden sm:flex items-center gap-2">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-success"></span>
                    </span>
                    <span class="text-sm font-medium text-text-muted">System Online</span>
                </div>
                <button class="p-2 text-text-muted hover:text-white transition-colors hover:bg-white/5 rounded-full">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-8 flex flex-col gap-10">
        
        <!-- Command Center -->
        <div class="w-full relative" id="command-center-root">
            
            <!-- Loading Skeleton Overlay (Hidden by default) -->
            <div id="loading-overlay" class="hidden absolute inset-0 z-10 bg-surface-900/50 backdrop-blur-sm rounded-2xl flex items-center justify-center transition-opacity duration-300">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-16 h-16 relative">
                        <div class="absolute inset-0 border-4 border-primary/20 rounded-full"></div>
                        <div class="absolute inset-0 border-4 border-primary rounded-full border-t-transparent animate-spin"></div>
                    </div>
                    <span class="text-primary font-medium tracking-widest uppercase text-sm animate-pulse">Running Multi-Vector Analysis...</span>
                </div>
            </div>

            <div id="command-center-card" class="glass-card p-6 md:p-8 flex flex-col gap-8 transition-opacity duration-300">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    
                    <!-- Left: Text Input -->
                    <div class="flex flex-col gap-3">
                        <label class="text-sm font-semibold text-text flex items-center gap-2">
                            <i data-lucide="search" class="w-4 h-4 text-primary"></i>
                            Claim or Text Segment
                        </label>
                        <textarea id="text-input" placeholder="Paste a suspicious claim, news excerpt, or social media post for context analysis..." class="w-full bg-surface-800 border border-white/5 rounded-xl p-4 text-text placeholder-text-muted focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all resize-none min-h-[120px]"></textarea>
                    </div>

                    <!-- Right: URL & Image Upload -->
                    <div class="flex flex-col gap-6">
                        
                        <!-- URL Input -->
                        <div class="flex flex-col gap-3">
                            <label class="text-sm font-semibold text-text flex items-center gap-2">
                                <i data-lucide="link" class="w-4 h-4 text-primary"></i>
                                Article URL
                                <span class="ml-auto flex items-center gap-1 text-[10px] uppercase tracking-wider bg-success/20 text-success px-2 py-0.5 rounded-full border border-success/30">
                                    <i data-lucide="lock" class="w-3 h-3"></i> HTTPS Only
                                </span>
                            </label>
                            <div class="relative">
                                <input type="url" id="url-input" placeholder="https://example.com/news-article" class="w-full bg-surface-800 border border-white/5 rounded-xl pl-10 pr-4 py-3.5 text-text placeholder-text-muted focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all" />
                                <i data-lucide="link" class="w-5 h-5 text-text-muted absolute left-3.5 top-3.5"></i>
                            </div>
                        </div>

                        <!-- Image Dropzone -->
                        <div class="flex flex-col gap-3 h-full">
                            <label class="text-sm font-semibold text-text flex items-center gap-2">
                                <i data-lucide="image" class="w-4 h-4 text-primary"></i>
                                VisualLens (Image Analysis)
                            </label>
                            <div id="dropzone" class="flex-1 relative rounded-xl border-2 border-dashed border-white/10 bg-surface-800 hover:border-white/20 hover:bg-surface-700/50 transition-all duration-200 flex flex-col items-center justify-center p-6 text-center min-h-[120px]">
                                <input type="file" id="file-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                                <div id="dropzone-empty">
                                    <i data-lucide="upload-cloud" class="w-8 h-8 mb-3 text-text-muted mx-auto transition-colors"></i>
                                    <p class="text-sm text-text-muted">
                                        <span class="text-primary font-medium">Click to upload</span> or drag and drop
                                    </p>
                                    <p class="text-xs text-text-muted/70 mt-1">PNG, JPG up to 10MB</p>
                                </div>
                                <div id="dropzone-preview" class="hidden relative w-full h-full min-h-[140px] rounded-lg overflow-hidden group">
                                    <img id="preview-image" src="" alt="Upload preview" class="w-full h-full object-cover rounded-lg" />
                                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center z-20">
                                        <button id="clear-image-btn" class="bg-alert text-white p-2 rounded-full hover:scale-110 transition-transform shadow-lg cursor-pointer">
                                            <i data-lucide="x" class="w-5 h-5"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Center CTA -->
                <div class="flex justify-center mt-2">
                    <button id="analyze-btn" disabled class="btn-primary px-8 py-3.5 text-lg flex items-center gap-2 group w-full md:w-auto min-w-[240px] justify-center">
                        <i data-lucide="search" class="w-5 h-5 group-hover:animate-pulse"></i>
                        <span id="analyze-btn-text">Analyze Context</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Dynamic Results Container -->
        <div id="results-container" class="hidden flex-col gap-8 transition-all duration-500">
            <!-- Populated via Javascript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-white/5 bg-surface-900 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-xs text-text-muted/70 flex items-center justify-center gap-2">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-warning"></i>
                <strong>DISCLAIMER:</strong> CAWNCADE AI provides probabilistic insights based on retrieved data and multi-vector analysis. It does not determine absolute truth.
            </p>
        </div>
    </footer>

    <script src="ui/components.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
