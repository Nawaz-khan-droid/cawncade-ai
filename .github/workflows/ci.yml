# GitHub Actions CI/CD for CAWNCADE AI

name: CAWNCADE CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend Lint & Test
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black isort
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 app/ --count --max-line-length=120 --statistics --ignore=E501,W503

      - name: Check formatting (black)
        run: black --check app/

      - name: Import check
        run: python -c "from app.main import app; print('Import OK')"

      - name: Run basic health test
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          python -c "import httpx; r = httpx.get('http://localhost:8000/health'); assert r.status_code == 200; print('Health check passed')"

  # Frontend Build Check
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx eslint src/ --ext .js,.jsx --no-error-on-unmatched-pattern || true

      - name: Build
        run: npm run build
        env:
          CI: true

  # Docker Build Test
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cawncade-backend:test ./backend

      - name: Build frontend image
        run: docker build -t cawncade-frontend:test ./frontend

      - name: Test docker-compose
        run: docker-compose build

  # Deploy (only on main branch push)
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "=== DEPLOY READY ==="
          echo "All checks passed. Ready for deployment to:"
          echo "  - Railway: railway up"
          echo "  - Render: push to connected repo"
          echo "  - GCP Cloud Run: gcloud run deploy"
